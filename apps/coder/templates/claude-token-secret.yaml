apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-claude-token
  namespace: coder
spec:
  secretStoreRef:
    name: aws-secret-manager
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: coder-claude-token
  data:
    - secretKey: token
      remoteRef:
        key: coder-claude-token
        property: token
