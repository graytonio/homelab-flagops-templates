apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-template-sync-script
  namespace: coder
data:
  sync.sh: |
    #!/bin/sh
    set -eu

    REPO_URL="https://github.com/graytonio/homelab-flagops-templates.git"
    STATE_CONFIGMAP="coder-template-sync-state"
    TOKEN_SECRET="coder-template-sync-token"
    NAMESPACE="coder"
    CODER_URL="http://coder.coder.svc.cluster.local"
    export CODER_URL
    PREPULL_DAEMONSET="coder-template-image-prepull"
    ROTATE_THRESHOLD_SECONDS=$((24 * 3600))
    TOKEN_LIFETIME_SECONDS=$((7 * 24 * 3600))

    # alpine/k8s bundles kubectl/git/curl but not the coder CLI itself --
    # install it fresh each run (confirmed empirically: "coder: not found"
    # on a real run without this). The pod's hostAliases entry (see
    # template-sync-cronjob.yaml) is what lets this curl call actually
    # resolve the hardcoded public hostname install.sh downloads from.
    if ! command -v coder >/dev/null 2>&1; then
      curl -fsSL "$CODER_URL/install.sh" | sh
    fi

    # This secret is self-managed, not AWS/ExternalSecret-backed: Coder API
    # tokens here are capped at a 7-day server-enforced max lifetime, and an
    # ExternalSecret's periodic refresh from AWS would just overwrite this
    # job's own rotated token with the stale one AWS still has -- fighting
    # the rotation instead of supporting it. Bootstrapped once by hand
    # (kubectl create secret with token/token_name/expires_at), then this
    # job owns it entirely from here on.
    CURRENT_TOKEN=$(kubectl get secret "$TOKEN_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.token}' | base64 -d)
    CURRENT_EXPIRES_AT=$(kubectl get secret "$TOKEN_SECRET" -n "$NAMESPACE" -o jsonpath='{.data.expires_at}' | base64 -d)

    CODER_SESSION_TOKEN="$CURRENT_TOKEN"
    export CODER_SESSION_TOKEN

    NOW=$(date +%s)
    if [ $((CURRENT_EXPIRES_AT - NOW)) -lt "$ROTATE_THRESHOLD_SECONDS" ]; then
      echo "Token expires at $CURRENT_EXPIRES_AT (now $NOW), rotating"
      NEW_TOKEN_NAME="coder-template-sync-${NOW}"
      NEW_TOKEN=$(coder tokens create --name "$NEW_TOKEN_NAME" --lifetime 168h)
      NEW_EXPIRES_AT=$((NOW + TOKEN_LIFETIME_SECONDS))

      kubectl create secret generic "$TOKEN_SECRET" -n "$NAMESPACE" \
        --from-literal=token="$NEW_TOKEN" \
        --from-literal=token_name="$NEW_TOKEN_NAME" \
        --from-literal=expires_at="$NEW_EXPIRES_AT" \
        --dry-run=client -o yaml | kubectl apply -f -

      CODER_SESSION_TOKEN="$NEW_TOKEN"
      export CODER_SESSION_TOKEN

      # Best-effort cleanup of every previously-rotated token except the one
      # just created -- token names must be unique per user, so without this
      # they'd accumulate in Coder's token list forever. A failure here is a
      # tidiness issue, not a correctness one, so it must never block the
      # rest of the run (hence `|| true` and no `set -e` interaction via the
      # `while` loop reading from a pipe).
      coder tokens list -c name 2>/dev/null | tail -n +2 | sed 's/[[:space:]]*$//' | grep '^coder-template-sync' | grep -vx "$NEW_TOKEN_NAME" | while read -r old_name; do
        echo "Removing superseded token: $old_name"
        coder tokens remove "$old_name" --delete || true
      done
    fi

    WORKDIR=$(mktemp -d)
    git clone --quiet "$REPO_URL" "$WORKDIR/repo"
    cd "$WORKDIR/repo"

    kubectl get configmap "$STATE_CONFIGMAP" -n "$NAMESPACE" >/dev/null 2>&1 || \
      kubectl create configmap "$STATE_CONFIGMAP" -n "$NAMESPACE"

    # Pre-pull the workspace image on every node before anyone tries to
    # create a workspace with it. Runs unconditionally, decoupled from the
    # per-template push loop below -- must fire even when only the image
    # digest changed and no template text did.
    current_image=$(grep -oE 'image\s*=\s*"[^"]+nixos-workspace[^"]+"' coder-templates/nix-dev/main.tf | sed -E 's/image\s*=\s*"([^"]+)"/\1/' | head -1)
    last_image=$(kubectl get configmap "$STATE_CONFIGMAP" -n "$NAMESPACE" \
      -o jsonpath='{.data.prepulled_image}' 2>/dev/null || true)

    if [ -n "$current_image" ] && [ "$current_image" != "$last_image" ]; then
      echo "Image changed ($last_image -> $current_image), pre-pulling on all nodes"
      cat <<EOF | kubectl apply -f -
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: $PREPULL_DAEMONSET
      namespace: $NAMESPACE
    spec:
      selector:
        matchLabels:
          app: $PREPULL_DAEMONSET
      template:
        metadata:
          labels:
            app: $PREPULL_DAEMONSET
        spec:
          terminationGracePeriodSeconds: 0
          containers:
            - name: prepull
              image: $current_image
              command: ["sh", "-c", "sleep 3600"]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
    EOF
      if kubectl rollout status daemonset/"$PREPULL_DAEMONSET" -n "$NAMESPACE" --timeout=480s; then
        kubectl patch configmap "$STATE_CONFIGMAP" -n "$NAMESPACE" --type merge \
          -p "{\"data\":{\"prepulled_image\":\"${current_image}\"}}"
      else
        echo "Pre-pull rollout did not complete in time; leaving state unset so the next run retries"
      fi
      kubectl delete daemonset "$PREPULL_DAEMONSET" -n "$NAMESPACE" --ignore-not-found
    fi

    for template_dir in coder-templates/*/; do
      template_name=$(basename "$template_dir")
      current_sha=$(git log -1 --format=%H -- "$template_dir")
      last_sha=$(kubectl get configmap "$STATE_CONFIGMAP" -n "$NAMESPACE" \
        -o jsonpath="{.data.${template_name}}" 2>/dev/null || true)

      if [ "$current_sha" = "$last_sha" ]; then
        echo "[$template_name] unchanged since $current_sha, skipping"
        continue
      fi

      echo "[$template_name] change detected ($last_sha -> $current_sha), pushing"
      coder templates push "$template_name" -d "$template_dir" --yes

      kubectl patch configmap "$STATE_CONFIGMAP" -n "$NAMESPACE" --type merge \
        -p "{\"data\":{\"${template_name}\":\"${current_sha}\"}}"
    done
