apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: coder-template-sync-token
  namespace: coder
spec:
  secretStoreRef:
    name: default
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: coder-template-sync-token
  data:
    - secretKey: token
      remoteRef:
        key: coder-template-sync-token
