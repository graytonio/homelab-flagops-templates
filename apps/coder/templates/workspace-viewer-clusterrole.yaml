# Read-only rules only -- this ClusterRole grants nothing by itself. Bound
# per-namespace (RoleBinding, not ClusterRoleBinding) to an opted-in
# workspace's own ServiceAccount by coder-templates/nix-dev/main.tf's
# cluster_access parameter, so a workspace can `kubectl get`/`describe`
# across the cluster to verify ArgoCD rollouts without ever getting write
# access anywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-workspace-viewer
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - events
      - namespaces
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
      - replicasets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - applicationsets
      - appprojects
    verbs: ["get", "list", "watch"]
