# Namespaces where an opted-in workspace (coder-templates/nix-dev/main.tf's
# cluster_access parameter) can get a read-only RoleBinding. Each entry gets a
# narrow Role+RoleBinding (apps/coder/templates/workspace-rbac-provisioner.yaml)
# granting the coder ServiceAccount below only rolebindings management in that
# namespace -- never pods/PVCs, so this list growing doesn't widen what the
# control plane itself can do. Mirrors apps/**/ (each app's Chart.yaml
# directory name is its ArgoCD destination namespace, per
# projects/production.yaml's ApplicationSet) plus argocd itself. Keep in sync
# with local.workspace_access_namespaces in coder-templates/nix-dev/main.tf --
# a namespace missing from one place silently has no effect there.
workspaceAccessNamespaces:
  - argocd
  - coder
  - db-operators
  - discord-file-sync-bot
  - external-dns
  - external-secrets
  - gotify
  - homeassistant
  - homepage
  - longhorn
  - metallb
  - observability
  - pirate-ship
  - reloader
  - system-upgrade
  - traefik
  - truenas-scale

coder:
  # The upstream coder chart namespaces its own values under a top-level
  # `coder:` key internally (its templates read .Values.coder.ingress,
  # .Values.coder.service, etc). Since this dependency is aliased as `coder`
  # in Chart.yaml, this outer `coder:` block becomes the subchart's root
  # Values — so it must be nested one level deeper to actually reach the
  # subchart's templates.
  coder:
    serviceAccount:
      # The chart's default Role (workspacePerms: true, on by default) only
      # covers pods/persistentvolumeclaims -- it has no rights to manage
      # ServiceAccounts even in its own namespace. Needed so Terraform
      # (running as this SA) can create the per-workspace ServiceAccount for
      # coder-templates/nix-dev/main.tf's opt-in cluster_access parameter.
      extraRules:
        - apiGroups: [""]
          resources: ["serviceaccounts"]
          verbs:
            - create
            - delete
            - get
            - list
            - patch
            - update
            - watch

    service:
      # Traefik fronts this via the Ingress below; the chart default of
      # LoadBalancer would otherwise consume a MetalLB IP unnecessarily.
      type: ClusterIP

    ingress:
      # Disabled here on purpose: this chart has no values hook to add
      # custom labels to its Ingress, but the private Traefik instance
      # only watches Ingresses labeled access=private
      # (--providers.kubernetesingress.labelSelector=access=private) --
      # without that label Traefik silently ignores the Ingress entirely
      # (no error, no router, status.loadBalancer never populates).
      # templates/ingress.yaml in this chart replaces it with an
      # equivalent manifest that carries the required label.
      enable: false

    env:
      - name: PGUSER
        valueFrom:
          secretKeyRef:
            name: coder.coder-postgresql.credentials.postgresql.acid.zalan.do
            key: username
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: coder.coder-postgresql.credentials.postgresql.acid.zalan.do
            key: password
      - name: CODER_PG_CONNECTION_URL
        # The postgres-operator's Spilo image only accepts hostssl
        # connections (pg_hba.conf rejects plain "host" entries), so
        # sslmode=disable fails outright -- require SSL instead.
        value: "postgres://$(PGUSER):$(PGPASSWORD)@coder-postgresql.coder.svc.cluster.local:5432/coder?sslmode=require"
      - name: CODER_ACCESS_URL
        value: https://coder.[{ env "env_domain" }]
      - name: CODER_EXTERNAL_AUTH_0_ID
        value: primary-github
      - name: CODER_EXTERNAL_AUTH_0_TYPE
        value: github
      - name: CODER_EXTERNAL_AUTH_0_CLIENT_ID
        value: Iv23liwNrD7odUfBMsY0
      - name: CODER_EXTERNAL_AUTH_0_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: coder-github-external-auth
            key: client_secret
      - name: CODER_EXTERNAL_AUTH_0_REVOKE_URL
        # This is a GitHub App (not a classic OAuth App) -- identifiable by
        # the client ID's Iv23li prefix -- which is what makes the
        # /applications/<client_id>/grant revoke endpoint valid here. The
        # client ID appears twice (above and in this URL); if the GitHub App
        # is ever recreated, both must be updated together.
        value: https://api.github.com/applications/Iv23liwNrD7odUfBMsY0/grant
