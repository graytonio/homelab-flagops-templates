gotify:
  controllers:
    main:
      enabled: true
      replicas: 1
      annotations:
        argocd.argoproj.io/sync-options: Replace=true
      containers:
        main:
          nameOverride: gotify
          image:
            repository: gotify/server
            tag: 3.0.0
            pullPolicy: IfNotPresent
          env:
            # PGUSER/PGPASSWORD come from the postgres-operator's
            # auto-generated credentials secret (no manual secret.yaml here
            # anymore). On merge, ArgoCD prunes the old hardcoded secret
            # before the operator's next repair cycle (up to 5m) regenerates
            # it, so a brief CreateContainerConfigError on this pod during
            # rollout is expected and self-heals — not a regression.
            - name: TZ
              value: America/New_York
            - name: GOTIFY_DATABASE_DIALECT
              value: postgres
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: gotify.gotify-postgresql.credentials.postgresql.acid.zalan.do
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: gotify.gotify-postgresql.credentials.postgresql.acid.zalan.do
                  key: password
            - name: GOTIFY_DATABASE_CONNECTION
              value: "host=gotify-postgresql.gotify.svc.cluster.local port=5432 user=$(PGUSER) password=$(PGPASSWORD) dbname=gotify"
  service:
    main:
      controller: main
      primary: true
      ports:
        http:
          port: 80
  
  ingress:
    main:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Gotify
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/icon: gotify.png
        gethomepage.dev/name: Gotify
        external-dns.alpha.kubernetes.io/target: [{ env "external_service_public_endpoint" }]
      labels:
        access: public
      tls:
      - hosts:
        - alerts.[{ env "env_domain" }]
        secretName: tls-gotify-ingress-dns
      hosts:
        - host: alerts.[{ env "env_domain" }]
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      size: 10Gi
      forceRename: gotify-production-data
      globalMounts:
        - path: /app/data