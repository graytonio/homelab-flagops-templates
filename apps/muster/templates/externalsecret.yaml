apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: muster-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-manager
    kind: ClusterSecretStore
  target:
    name: muster-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: {{ .Values.secrets.claudeToken }}
        property: token
    - secretKey: GH_TOKEN
      remoteRef:
        key: {{ .Values.secrets.githubToken }}
        property: token
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: {{ .Values.secrets.tailscaleAuthKey }}
        property: authkey
