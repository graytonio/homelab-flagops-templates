acme:
  enabled: true
  production: true
  email: g-buddy@comcast.net

cloudflare:
  email: graytonio.ward@gmail.com
  secretRef: cloudflare-credentials
  secretKey: cloudflare_api_token
  remoteSecret: cloudflare-dns-apikey
  domain: graytonward.com

hosts:
  private: traefik.private.graytonward.com
  public: traefik.public.graytonward.com

privateingress:
  deployment:
    kind: DaemonSet
    podAnnotations:
      app.kubernetes.io/instance: private-ingress
    labels:
      app.kubernetes.io/instance: private-ingress
      access: private
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  additionalArguments:
    - --api.insecure=true
  service:
    spec:
      loadBalancerIP: 10.0.0.90
  ingressClass:
    name: private-traffic
    isDefaultClass: true
  ingressRoute:
    dashboard:
      enabled: false
  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
  providers:
    kubernetesCRD:
      labelSelector: "access=private"
      allowCrossNamespace: true
    kubernetesIngress:
      labelSelector: "access=private"
      publishedService:
        enabled: true


publicingress:
  deployment:
    kind: DaemonSet
    podAnnotations:
      app.kubernetes.io/instance: public-ingress
    labels:
      app.kubernetes.io/instance: public-ingress
      access: public
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  additionalArguments:
    - --api.insecure=true
  service:
    spec:
      loadBalancerIP: 10.0.0.91
  ingressClass:
    name: public-traffic
    isDefaultClass: false
  ingressRoute:
    dashboard:
      enabled: false
  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
  providers:
    kubernetesCRD:
      labelSelector: "access=public"
      allowCrossNamespace: true
    kubernetesIngress:
      labelSelector: "access=public"
      publishedService:
        enabled: true

cert-manager:
  installCRDs: true
