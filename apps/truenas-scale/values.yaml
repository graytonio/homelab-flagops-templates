externalservice:
  ipAddress: 10.0.0.50
  port:
    service: 8123
    target: 80
    name: http

  service:
    enabled: true

  ingress:
    enabled: true
    ingressClassName: private-traffic
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    labels:
      access: private
    tls:
      - hosts:
          - vault.graytonward.com
        secretName: tls-truenasscale-dns
    host: vault.graytonward.com