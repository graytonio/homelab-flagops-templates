apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd-autopilot.argoproj-labs.io/default-dest-server: https://kubernetes.default.svc
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-5"
  name: production
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: production deployments
  destinations:
  - namespace: '*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: production
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/graytonio/homelab-flagops-templates
        requeueAfterSeconds: 20
        revision: HEAD
        files:
          - path: apps/**/Chart.yaml
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/name: '{{ .path.basename }}'
        app.kubernetes.io/instance: '{{ .path.basename }}-production'
      name: '{{ .path.basename }}-production'
      namespace: 'argocd'
    spec:
      destination:
        namespace: '{{ .path.basename }}'
        server: https://kubernetes.default.svc
      ignoreDifferences:
        - group: argoproj.io
          jsonPointers:
            - /status
          kind: Application
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers:
            - /spec/conversion/webhook/clientConfig/caBundle
            - /spec/versions/0/selectableFields
            - /spec/versions/1/selectableFields
            - /spec/versions/2/selectableFields
      project: production
      source:
        path: '{{ .path.path }}'
        repoURL: 'https://github.com/graytonio/homelab-flagops-templates'
        helm:
          releaseName: '{{ .path.basename }}-production'
          # The previous flagops CMP ran plain `helm template` without
          # --include-crds; keep CRDs in charts' crds/ dirs unmanaged so an
          # app prune can never cascade-delete every CR of that type.
          skipCrds: true
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        automated:
          prune: true
          selfHeal: true